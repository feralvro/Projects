name: Publicar web (Inventory Watch)

# Repositorio nuevo, solo para la web. Los datos los escribe el contador del repositorio
# feralvro/Projects (público); aquí se leen cada día y se publica la web.
on:
  schedule:
    - cron: "55 14 * * *"   # el contador corre a las 14:37 UTC; esto va justo después
  push:
    branches: [main]
    paths: ["web/**", "scripts/exportar_web.py", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Traer los datos del contador (repositorio público Projects)
        uses: actions/checkout@v4
        with:
          repository: feralvro/Projects
          ref: main
          path: datos_src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar los datos de la web (panel y días)
        run: python scripts/exportar_web.py --datos datos_src/data --salida web/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
