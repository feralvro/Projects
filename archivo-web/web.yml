name: Publicar web (Inventory Watch)

# La web vive en el mismo repo que el contador (feralvro/Projects). Se publica sola en cuanto
# el contador diario termina (acaba entre las 19:00 y las 23:00 UTC), y ademas:
#  - cada madrugada (03:30 UTC) como red de seguridad,
#  - cuando cambia algo en web/ o en este fichero,
#  - a mano desde Actions.
on:
  workflow_run:
    workflows: ["Contador diario de inventario $OPEN"]
    types: [completed]
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [main]
    paths: ["web/**", "scripts/exportar_web.py", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Traer los datos del contador (repositorio público Projects)
        uses: actions/checkout@v4
        with:
          repository: feralvro/Projects
          ref: main
          path: datos_src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar los datos de la web (panel y días)
        run: python scripts/exportar_web.py --datos datos_src/data --salida web/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
